<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>MyopiaGuard — здоровье глаз в классе</title>
    <meta
      name="description"
      content="MyopiaGuard управляет режимом перерывов для глаз на школьных компьютерах: панель учителя, отчёты и аналитика школы без сбора персональных данных."
    />

    <!--
      Self-hosted Cyrillic faces, preloaded.

      The interface opens in Russian, so the Cyrillic subsets are the ones on the
      critical path: without these hints the browser only discovers the file after
      CSS is parsed and the first text has been laid out, which shows a flash of
      the fallback face and shifts the layout when Bitter/Manrope arrive.
      crossorigin is required for font fetches even same-origin.
    -->
    <link
      rel="preload"
      href="/fonts/manrope-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bitter-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23107a5e'/%3E%3Cpath d='M6 16c3-4.5 6.5-6.5 10-6.5S23 11.5 26 16c-3 4.5-6.5 6.5-10 6.5S9 20.5 6 16Z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
